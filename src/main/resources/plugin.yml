name: BerryBasket
version: ${version}
main: dev.shadow.berrybasket.BerryBasket
depend: [PyroFarming]
softdepend: [Nexo]
api-version: '1.21'

commands:
  berrybasket:
    aliases: [bb]
    usage: /<command> <reload|get|give|fix>

permissions:
  berrybasket.reload:
    default: op
  berrybasket.get:
    default: op
  berrybasket.give:
    default: op
  berrybasket.fix:
    default: true